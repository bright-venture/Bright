<h2>Reset your Bright portal password</h2>
<p>You requested a new password for your Bright portal employee account.</p>
<p><a href="{{ .SiteURL }}/auth/confirm#token_hash={{ .TokenHash }}&amp;type=recovery">Reset password</a></p>
<p>On the page that opens, select Continue to new password.</p>
<p>If you did not request this email, you can ignore it.</p>
