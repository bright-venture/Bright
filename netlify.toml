# Netlify publishes only site/, the build output (run `npm run build` and commit it before pushing).
# Sources, originals and tooling in the rest of the repo are never public.
# The Content-Security-Policy is generated by the build into site/_headers (it holds hashes of the inline code).
[build]
  publish = "site"
  # Deploy only when the website changed: pushes that touch only portal/ or tooling skip it
  # (each production deploy costs Netlify credits). The portal is its own Netlify site (portal/netlify.toml).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml"

# Old ?lang= links from the previous single-page version
[[redirects]]
  from = "/"
  to = "/ar/"
  status = 301
  force = true
  query = { lang = "ar" }

[[redirects]]
  from = "/"
  to = "/el/"
  status = 301
  force = true
  query = { lang = "el" }

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fonts, photos, share images and the video carry a content hash in their names: a changed file gets a new URL.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Logos and icons keep fixed names
[[headers]]
  for = "/assets/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
